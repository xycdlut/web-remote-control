<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>远程控制</title>
<link rel="stylesheet" href="style.css?v=36" />
</head>
<body>
  <!-- 登录 -->
  <div id="login" class="overlay">
    <form id="loginForm" class="card" autocomplete="off">
      <h1>远程控制</h1>
      <p class="sub">请输入被控端访问密码</p>
      <input id="password" type="password" placeholder="访问密码" autocomplete="current-password" required />
      <button id="connectBtn" type="submit">连接</button>
      <p id="loginError" class="error"></p>
      <p class="hint">连接后请按提示进入全屏，以锁定键盘。</p>
    </form>
  </div>

  <!-- 查看器 -->
  <div id="viewer" class="hidden">
    <div id="stage" tabindex="0">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" class="hidden"></canvas>
      <canvas id="cursorLayer"></canvas>
      <div id="placeholder">等待画面…</div>
    </div>

    <div id="toolbar">
      <span id="status" class="pill">连接中…</span>
      <span id="stats" class="pill"></span>
      <span id="diag" class="pill"></span>
      <span class="spacer"></span>
      <label class="chk" title="本地即时光标：光标跟手，但看不到被控机真实光标形状">
        <input type="checkbox" id="localCursorChk" checked /> 本地光标
      </label>
      <select id="qualitySel" title="画质档位（越高越吃 CPU，无独显机器建议流畅/均衡）">
        <option value="1024">流畅 1024×576</option>
        <option value="1440">均衡 1440×810</option>
        <option value="1920" selected>高清 1920×1080</option>
      </select>
      <button id="fallbackBtn" title="兼容模式：优先 H.264 硬解，失败则 JPEG">兼容模式</button>
      <button id="keyboardBtn" title="全屏并锁定键盘">全屏锁定</button>
      <button id="disconnectBtn">断开</button>
    </div>

    <div id="toast" class="hidden"></div>
  </div>

  <script src="app.js?v=36"></script>
</body>
</html>
